name: CI/CD Pipeline - SAST & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Trivy Open-Source SAST & Vulnerability Scanner ---
      - name: Run Trivy SAST & Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.29.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0' # Set to '1' to fail the pipeline if critical issues are found
          ignore-unfixed: true
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL,HIGH'

      # --- Node.js Dependency Security Audit & Linting ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true # Prevent build blockage on moderate/high zero-days while alerting

      - name: Run code quality & security linter
        run: npm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: sast # Build runs after SAST completes; remove 'needs: sast' if you prefer parallel execution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (TypeScript Check + Vite Build)
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 14
