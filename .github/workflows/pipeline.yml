name: CI/CD Pipeline - SAST & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  sast:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required for CodeQL to report security events to GitHub Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- GitHub CodeQL SAST Analysis ---
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      # --- Node.js Dependency Security Audit & Linting ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dependency security audit
        run: npm audit --audit-level=high
        continue-on-error: true # Prevent build blockage on moderate/high zero-days while alerting

      - name: Run code quality & security linter
        run: npm run lint

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: sast # Build runs after SAST completes; remove 'needs: sast' if you prefer parallel execution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle (TypeScript Check + Vite Build)
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist/
          retention-days: 14
